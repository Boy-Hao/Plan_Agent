global:
  env: prod
  imagePullSecrets: []
  tenantMode: multi

image:
  repository: registry.example.com/cloud-agent
  tag: "1.0.0"
  pullPolicy: IfNotPresent

api:
  replicas: 3
  resources:
    requests: {cpu: "500m", memory: "1Gi"}
    limits: {cpu: "2", memory: "2Gi"}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 60
  env:
    APP_ENV: prod
    APP_LOG_LEVEL: INFO
  podDisruptionBudget:
    minAvailable: 2

runtime:
  replicas: 3
  resources:
    requests: {cpu: "1", memory: "2Gi"}
    limits: {cpu: "4", memory: "8Gi"}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 65

sseGateway:
  replicas: 2
  resources:
    requests: {cpu: "500m", memory: "1Gi"}
    limits: {cpu: "2", memory: "4Gi"}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60

worker:
  replicas: 2
  resources:
    requests: {cpu: "500m", memory: "1Gi"}
    limits: {cpu: "2", memory: "2Gi"}

sandboxWorker:
  replicas: 2
  resources:
    requests: {cpu: "1", memory: "2Gi"}
    limits: {cpu: "4", memory: "8Gi"}
  nodeSelector:
    role: sandbox
  tolerations:
    - key: role
      operator: Equal
      value: sandbox
      effect: NoSchedule

mysql:
  host: mysql.example.internal
  port: 3306
  database: cloud_agent
  existingSecret: cloud-agent-db
  poolSize: 20
  readHost: mysql-read.example.internal

redis:
  url: redis://redis.example.internal:6379/0
  existingSecret: cloud-agent-redis
  poolSize: 50

oss:
  endpoint: https://oss.example.com
  bucket: cloud-agent-prod
  region: cn-hangzhou
  existingSecret: cloud-agent-oss
  presignTTL: 600

sso:
  baseUrl: https://sso.example.com
  clientId: cloud-agent
  redirectUri: https://agent.example.com/auth/callback
  existingSecret: cloud-agent-sso

jwt:
  existingSecret: cloud-agent-jwt
  accessTTL: 1800
  refreshTTL: 604800

llm:
  defaultProvider: openai
  requestTimeout: 120
  firstTokenTimeout: 30
  maxRetries: 1
  circuitErrorRate: 0.3

quota:
  defaultTPM: 100000
  defaultMode: ENFORCE

sandbox:
  provider: e2b
  maxConcurrency: 50
  warmPool: 10
  gitTokenTTL: 1800

feishu:
  enabled: true
  existingSecret: cloud-agent-feishu

gitlab:
  enabled: true
  baseUrl: https://gitlab.example.com
  existingSecret: cloud-agent-gitlab

ingress:
  enabled: true
  className: nginx
  host: agent.example.com
  tlsSecret: cloud-agent-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

observability:
  otelEnabled: true
  otelEndpoint: http://otel-collector:4317
  sampleRate: 0.1
  prometheusEnabled: true

features:
  multiAgent: true
  sandbox: true
  quotaEnforce: true
  permissionAudit: false
  ossGovernance: false
  feishu: true
  gitlab: true
  a2a: false
  embedBridge: false
