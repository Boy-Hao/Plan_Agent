upstream api_upstream { server api:8000; }
upstream runtime_upstream { server runtime:8100; }

server {
  listen 80;
  server_name _;
  client_max_body_size 100m;

  # Web static (built SPA)
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # API
  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    add_header X-Accel-Buffering no;
  }

  # Runtime (internal only; remove public exposure in prod)
  location /runtime/ {
    proxy_pass http://runtime_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    add_header X-Accel-Buffering no;
  }

  # SSE: disable buffering, long timeout
  location ~ ^/api/conversations/.*/(chat|live)$ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    add_header X-Accel-Buffering no;
  }

  location = /health.json {
    proxy_pass http://api_upstream/health.json;
    access_log off;
  }
}
